name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  BINARYEN_VERSION: version_132
  BINARYEN_SHA256: 195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572
  # Pinned, because a new release reformatting something would fail an unrelated pull request.
  SYNTAX_TREE_VERSION: 6.3.0

jobs:
  test:
    runs-on: ubuntu-latest
    # Building merman for wasm32-wasip1 and loading the ~50 MB generated Ruby dominate the wall time; the build is skipped when the wasm build products cache hits.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Add the wasm32-wasip1 Rust target
        run: rustup target add wasm32-wasip1
      # The Rakefile calls wasm-opt with --enable-bulk-memory, --enable-sign-ext, and --enable-nontrapping-float-to-int, all of which this release accepts.
      - name: Install binaryen
        run: |
          curl -fsSL --retry 5 -o /tmp/binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN_VERSION/binaryen-$BINARYEN_VERSION-x86_64-linux.tar.gz"
          echo "$BINARYEN_SHA256  /tmp/binaryen.tar.gz" | sha256sum -c -
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          echo "/tmp/binaryen-$BINARYEN_VERSION/bin" >> "$GITHUB_PATH"
      - name: Read the pinned dewasm revision
        id: dewasm
        run: echo "revision=$(cat DEWASM_REVISION)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: dewasm-cache
        with:
          path: ~/.dewasm
          key: dewasm-${{ runner.os }}-${{ steps.dewasm.outputs.revision }}
      - name: Build dewasm at the pinned revision
        if: steps.dewasm-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/dewasm/dewasm \
            --rev "${{ steps.dewasm.outputs.revision }}" --locked \
            --root ~/.dewasm dewasm-cli
      - name: Export DEWASM_BIN
        run: echo "DEWASM_BIN=$HOME/.dewasm/bin/dewasm" >> "$GITHUB_ENV"
      - run: bundle install --jobs 4
      - name: Read the rustc version
        id: rustc
        run: echo "version=$(rustc --version | tr ' ()' '-')" >> "$GITHUB_OUTPUT"
      # The products depend on the wrapper sources, the locked dependencies, the Rust toolchain, and the binaryen release; the key carries them all.
      - uses: actions/cache@v6
        id: wasm-cache
        with:
          path: |
            wasm/target/wasm32-wasip1/release/merman_wasm.wasm
            wasm/merman.wasm
          key: wasm-${{ runner.os }}-${{ steps.rustc.outputs.version }}-${{ env.BINARYEN_VERSION }}-${{ hashFiles('wasm/src/**', 'wasm/Cargo.toml', 'wasm/Cargo.lock') }}
      # Runs only when the wasm build products cache missed, so the usual run pays nothing for it.
      - uses: Swatinem/rust-cache@v2
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        with:
          workspaces: wasm
          shared-key: test
          # Only main writes the shared build cache; PRs restore it read-only to keep the repo under the 10 GB cache budget.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # This action's post-job cleanup deletes workspace-member artifacts from a cached target directory, and that post step runs before the wasm build products cache saves (post steps run in reverse step order), which would strip merman_wasm.wasm out of the saved products.
          # Caching only ~/.cargo avoids that; a cache-miss run recompiles the dependency crates instead.
          cache-targets: false
      - name: Build the wasm module
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: bundle exec rake wasm:build
      # The fresh checkout gives the wasm sources newer mtimes than the restored products, so without this the rake generate file tasks would rebuild them.
      - name: Mark the restored wasm build products current
        if: steps.wasm-cache.outputs.cache-hit == 'true'
        run: touch wasm/target/wasm32-wasip1/release/merman_wasm.wasm wasm/merman.wasm
      - run: bundle exec rake generate
      - run: bundle exec rake test

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Check the Rust format
        run: cargo fmt --check --manifest-path wasm/Cargo.toml
      # The file list comes from git, so the generated lib/dewasm/merman/wasm_module.rb, which is not committed, can never enter the check.
      - name: Check the Ruby format
        run: |
          gem install syntax_tree -v "$SYNTAX_TREE_VERSION"
          git ls-files 'Gemfile' 'Rakefile' '*.gemspec' 'lib/*.rb' 'tools/*.rb' 'test/*.rb' \
            | grep -v '/wasm_module\.rb$' \
            | xargs stree check
